{% set name = "cargo-bundle-licenses" %}
{% set version = "4.2.0" %}
{% set sha256 = "196d27676dae302d3c91315c1323b790f13b838b6dfd67b2f6c0236a55547765" %}

package:
  name: {{ name }}-suite
  version: {{ version }}

source:
  url: https://github.com/sstadick/cargo-bundle-licenses/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  ignore_run_exports:
    - libgit2

outputs:
  - name: {{ name }}
    script: build-unix.sh  # [not win]
    script: bld-win.bat  # [win]
    requirements:
      build:
        - {{ compiler('rust') }}
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - cargo-auditable
        - pkg-config
        - cmake
        - libgit2
      test:
        commands:
          - cargo-bundle-licenses --help
  - name: {{ name }}-gnu                    # [win]
    script: bld-win.bat                     # [win]
    requirements:                           # [win]
      build:                                # [win]
        - rust-gnu_win-64                   # [win]
        - {{ compiler('rust-gnu') }}        # [win]
        - {{ compiler('c') }}               # [win]
        - {{ compiler('m2w64_c') }}         # [win]
        - cargo-auditable                   # [win]
        - pkg-config                        # [win]
        - m2-make                           # [win]
        - cmake                             # [win]
        - libgit2                           # [win]
      test:                                 # [win]
        commands:                           # [win]
          - cargo-bundle-licenses --help    # [win]

about:
  home: https://github.com/sstadick/cargo-bundle-licenses
  license: MIT and Apache-2.0
  license_family: MIT
  license_file: LICENSE-MIT
  summary: Bundle thirdparty licenses for Cargo projects into a single file.
  description: A rust tool to bundle all third-party licenses into a single file.
  dev_url: https://github.com/sstadick/cargo-bundle-licenses
  doc_url: https://github.com/sstadick/cargo-bundle-licenses

extra:
  recipe-maintainers:
    - sstadick
